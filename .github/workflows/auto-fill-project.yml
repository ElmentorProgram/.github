name: "Reusable: Update Project Metadata"

# Trigger: This workflow is only called by other workflows
on:
  workflow_call:
    inputs:
      project_number:
        description: 'The Project Number (found in URL, e.g., projects/1)'
        required: true
        type: number
      organization:
        description: 'The Organization Name'
        required: true
        type: string
        default: 'ElmentorProgram'
    secrets:
      token:
        description: 'PAT with Project Write Access'
        required: true

jobs:
  update-project-fields:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Update Project Fields
        uses: actions/github-script@v7
        env:
          PROJECT_NUM: ${{ inputs.project_number }}
          ORG_NAME: ${{ inputs.organization }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          # ------------------------------------------------------------------
          # CONFIGURATION VARIABLES
          # Change these string values if you rename columns in the UI
          # ------------------------------------------------------------------
          FIELD_NAME_WEEK: "Week"
          FIELD_NAME_DATE: "Date"
          FIELD_NAME_MONTH: "Month"
        with:
          github-token: ${{ secrets.token }}
          script: |
            /**
             * AUTOMATION SCRIPT: Project V2 Auto-Fill
             * ---------------------------------------
             * Purpose: Auto-calculates Week/Date/Month when an issue is closed.
             * Author: Ayman (LGA) / Generated by Gemini
             */
            
            const { PROJECT_NUM, ORG_NAME, ISSUE_NODE_ID, FIELD_NAME_WEEK, FIELD_NAME_DATE, FIELD_NAME_MONTH } = process.env;
            // <--- INSERT CONSTANT HERE --->
            const MILLISECONDS_PER_DAY = 86400000;
            
            // --- HELPER: Calculate ISO Week (Monday Start) ---
            function getISOWeek(date) {
              const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
              const dayNum = d.getUTCDay() || 7; // Get day (1=Mon, ..., 7=Sun)
              d.setUTCDate(d.getUTCDate() + 4 - dayNum);
              const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
              return Math.ceil((((d - yearStart) / MILLISECONDS_PER_DAY) + 1)/7);
            }

            // --- HELPER: Get Short Month Name ---
            function getShortMonth(date) {
               return date.toLocaleString('en-US', { month: 'short' }); // Returns "Jan", "Feb", etc.
            }

            try {
              console.log(`🚀 Starting update for Issue ID: ${ISSUE_NODE_ID} in Org: ${ORG_NAME}, Project: ${PROJECT_NUM}`);

              // 1. Fetch Project ID and Field Definitions
              const queryProjectInfo = `
                query($org: String!, $number: Int!) {
                  organization(login: $org) {
                    projectV2(number: $number) {
                      id
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2Field { id name }
                          ... on ProjectV2SingleSelectField { id name options { id name } }
                        }
                      }
                    }
                  }
                }
              `;

              const projectData = await github.graphql(queryProjectInfo, {
                org: ORG_NAME,
                number: parseInt(PROJECT_NUM)
              });

              const project = projectData.organization?.projectV2;
              if (!project) throw new Error(`Project #${PROJECT_NUM} not found in org ${ORG_NAME}`);

              // 2. Find specific Field IDs from the schema
              const weekField = project.fields.nodes.find(f => f.name === FIELD_NAME_WEEK);
              const dateField = project.fields.nodes.find(f => f.name === FIELD_NAME_DATE);
              const monthField = project.fields.nodes.find(f => f.name === FIELD_NAME_MONTH);

              if (!weekField || !dateField || !monthField) {
                 throw new Error(`Missing Fields! Ensure Project has fields named: "${FIELD_NAME_WEEK}", "${FIELD_NAME_DATE}", "${FIELD_NAME_MONTH}"`);
              }
              
              console.log(`✅ Found Field IDs - Week: ${weekField.id}, Date: ${dateField.id}, Month: ${monthField.id}`);

              // 3. Find the Project Item ID associated with this Issue
              const queryIssueItem = `
                query($issueId: ID!) {
                  node(id: $issueId) {
                    ... on Issue {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                  }
                }
              `;
              
              const issueData = await github.graphql(queryIssueItem, { issueId: ISSUE_NODE_ID });
              const projectItem = issueData.node.projectItems.nodes.find(item => item.project.id === project.id);

              if (!projectItem) {
                 console.log("⚠️ Issue is NOT in the target project. No update needed.");
                 return; 
              }
              
              console.log(`✅ Found Project Item ID: ${projectItem.id}`);

              // 4. Calculate Values
              const now = new Date();
              const currentWeek = getISOWeek(now);
              const currentMonthName = getShortMonth(now); // "Jan", "Feb"
              const currentDateISO = now.toISOString().split('T')[0]; // "2025-01-15"

              console.log(`📝 Calculating: Week=${currentWeek}, Date=${currentDateISO}, Month=${currentMonthName}`);

              // 5. Match Month Name to Dropdown Option ID
              const monthOption = monthField.options.find(opt => opt.name === currentMonthName);
              if (!monthOption) throw new Error(`Month option "${currentMonthName}" not found in Project settings. Ensure all 12 month abbreviations (Jan-Dec) are configured in the Month field.`);

              // 6. Execute Mutation
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $weekField: ID!, $weekValue: Float!, $dateField: ID!, $dateValue: Date!, $monthField: ID!, $monthOptionId: String!) {
                  updateWeek: updateProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $weekField, value: { number: $weekValue }}) { projectV2Item { id } }
                  updateDate: updateProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $dateField, value: { date: $dateValue }}) { projectV2Item { id } }
                  updateMonth: updateProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $monthField, value: { singleSelectOptionId: $monthOptionId }}) { projectV2Item { id } }
                }
              `;

              await github.graphql(mutation, {
                projectId: project.id,
                itemId: projectItem.id,
                weekField: weekField.id,
                weekValue: parseFloat(currentWeek),
                dateField: dateField.id,
                dateValue: currentDateISO,
                monthField: monthField.id,
                monthOptionId: monthOption.id
              });

              console.log("🎉 Update Complete.");

            } catch (error) {
              console.error(`❌ Fatal Error: ${error.message}`);
              core.setFailed(`Workflow Failed: ${error.message}`);
            }
